name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Current Android command-line tools require Java 17+.
      # Use JDK 17 only while installing the Android SDK packages.
      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-29" "build-tools;29.0.3"

      # The legacy Android Gradle Plugin 3.2.1 / Gradle 4.10.3 toolchain
      # used for aauto-sdk v4.6 must run on Java 8.
      - name: Switch to JDK 8 for legacy Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Show tool versions
        run: |
          java -version
          gradle --version

      - name: Build debug APK with legacy AAPT1
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --console=plain --stacktrace --no-daemon 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "---- Compiler errors (if any) ----"
          grep -nE "error:|cannot find symbol|package .* does not exist|method .* cannot be applied" build.log || true
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VF6SplitMirror-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VF6SplitMirror-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
